<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="master-container">
        <h1 class="just-picture-it">
            Just Picture It
        </h1>
        <ul class="menu">
            <li class="ppl">People</li>
            <li class="product">Product</li>
            <li class="animal">Animals</li>
            <li class="car">Cars</li>
            <li class="graphics">Graphics</li>
        </ul>
        <br>
        <div class="images-container">

            <div class="image-container con1">
                <img src="./person-1.png" alt="" class="image">
                <p class="text">Original</p>
            </div>

            <div class="image-container con2">
                <img src="./person-2.png" alt="" class="image">
                <p class="text">Transparent Bckground</p>
            </div>

            <div class="image-container con3">
                <img src="./person-3.png" alt="" class="image">
                <p class="text">New Background</p>
            </div>

            <div class="image-container con4">
                <img src="./person-4.png" alt="" class="image">
                <p class="text">Endless Posibilities</p>
            </div>

        </div>

        <br><br><br><br><br><br><br><br><br><br>

        <div class="remove-bg-container">

            <h1 class="rmg">
                Remove Image Background
            </h1>
            <p class="get">
                Get a transparent background for any image.
            </p>

            <div class="remove">
                <button class="btn">Upload Image</button>
                <p class="drop-file">Or Drop a File,</p>
                <small class="small">
                    Paste Image or <u>URL</u>   
                </small>
            </div>
        </div>
